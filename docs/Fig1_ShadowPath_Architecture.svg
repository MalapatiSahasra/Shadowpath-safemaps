<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" font-family="Times New Roman, serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="520" fill="white"/>

  <!-- Layer 1: Client Application -->
  <rect x="110" y="20" width="500" height="70" rx="8" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
  <text x="360" y="42" text-anchor="middle" font-weight="bold" font-size="13" fill="#111">CLIENT APPLICATION</text>
  <text x="360" y="68" text-anchor="middle" font-size="11" fill="#333">Route Search  |  Map + Overlays  |  Route Comparison  |  Report Button</text>

  <!-- Arrow: Client to Scoring API -->
  <line x1="360" y1="90" x2="360" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="375" y="115" font-size="10" fill="#555" font-style="italic">Route Request</text>

  <!-- Layer 2: Safety Scoring API -->
  <rect x="180" y="130" width="360" height="60" rx="8" fill="#e8e8e8" stroke="#333" stroke-width="1.5"/>
  <text x="360" y="155" text-anchor="middle" font-weight="bold" font-size="13" fill="#111">SAFETY SCORING API</text>
  <text x="360" y="175" text-anchor="middle" font-size="11" fill="#333">Segment Scoring  ·  Route Ranking</text>

  <!-- Arrow: Scoring API to Routing Engine -->
  <line x1="280" y1="190" x2="200" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Arrow: Scoring API to Geospatial DB -->
  <line x1="440" y1="190" x2="520" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Layer 3a: Routing Engine -->
  <rect x="60" y="240" width="250" height="60" rx="8" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
  <text x="185" y="265" text-anchor="middle" font-weight="bold" font-size="12" fill="#111">ROUTING ENGINE</text>
  <text x="185" y="285" text-anchor="middle" font-size="11" fill="#333">(OSRM / Valhalla)</text>

  <!-- Layer 3b: Geospatial Database -->
  <rect x="380" y="240" width="280" height="130" rx="8" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
  <text x="520" y="263" text-anchor="middle" font-weight="bold" font-size="12" fill="#111">GEOSPATIAL DATABASE</text>
  <text x="520" y="280" text-anchor="middle" font-size="10" fill="#555">(PostGIS)</text>
  <text x="520" y="302" text-anchor="middle" font-size="11" fill="#333">OSM Ways</text>
  <text x="520" y="318" text-anchor="middle" font-size="11" fill="#333">Streetlight Points</text>
  <text x="520" y="334" text-anchor="middle" font-size="11" fill="#333">POI / Business Data</text>
  <text x="520" y="350" text-anchor="middle" font-size="11" fill="#333">Civic Nodes  ·  User Reports</text>

  <!-- Arrow: Geospatial DB to ETL Pipeline -->
  <line x1="520" y1="370" x2="520" y2="420" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="535" y="400" font-size="10" fill="#555" font-style="italic">Ingested by</text>

  <!-- Layer 4: ETL Pipeline -->
  <rect x="340" y="420" width="360" height="70" rx="8" fill="#e8e8e8" stroke="#333" stroke-width="1.5"/>
  <text x="520" y="445" text-anchor="middle" font-weight="bold" font-size="13" fill="#111">ETL PIPELINE</text>
  <text x="520" y="468" text-anchor="middle" font-size="11" fill="#333">OSM Extracts  |  Municipal Open Data  |  Government Datasets</text>

  <!-- Return arrow: Results back -->
  <line x1="610" y1="90" x2="610" y2="240" stroke="#333" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="625" y="170" font-size="9" fill="#888" font-style="italic">Results</text>
</svg>
